[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledc"
version = "0.1.0"
description = "LightGBM Ensemble DeConvolution for cell-type abundance prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "All rights reserved"}
authors = [{name = "LEDC development team"}]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "lightgbm",
    "scikit-learn",
    "matplotlib",
    "anndata",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
